name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clone Repo
        uses: actions/checkout@v4

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-environment

      - name: Build Repeater Firmware
        env:
          FIRMWARE_VERSION: ci-build
        run: /usr/bin/env bash build.sh build-repeater-firmwares

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ci-build
          path: out
          retention-days: 7

  static-analysis:
    runs-on: ubuntu-latest
    continue-on-error: true  # Don't fail PR on upstream code warnings
    steps:
      - name: Clone Repo
        uses: actions/checkout@v4

      - name: Install cppcheck
        run: sudo apt-get update && sudo apt-get install -y cppcheck

      - name: Run cppcheck on src/
        run: |
          cppcheck --enable=warning,performance,portability \
            --error-exitcode=1 \
            --suppress=missingIncludeSystem \
            --suppress=unusedFunction \
            --suppress=ctuOneDefinitionRuleViolation \
            --suppress=uninitMemberVar \
            --suppress=toomanyconfigs \
            --suppress=memsetClassFloat \
            --suppress=duplInheritedMember \
            --suppress=noCopyConstructor \
            --suppress=noOperatorEq \
            --suppress=memleak \
            --suppress=invalidPrintfArgType_uint \
            -I src/ \
            src/

      - name: Run cppcheck on examples/
        run: |
          cppcheck --enable=warning,performance,portability \
            --error-exitcode=1 \
            --suppress=missingIncludeSystem \
            --suppress=unusedFunction \
            --suppress=ctuOneDefinitionRuleViolation \
            --suppress=uninitMemberVar \
            --suppress=toomanyconfigs \
            --suppress=memsetClassFloat \
            --suppress=duplInheritedMember \
            --suppress=noCopyConstructor \
            --suppress=noOperatorEq \
            --suppress=memleak \
            --suppress=invalidPrintfArgType_uint \
            -I src/ -I examples/simple_repeater/ \
            examples/
